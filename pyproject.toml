[project]
name = "nebulamaster-workspace"
version = "0.5.2"
description = "Nebula Master workspace"
requires-python = ">=3.13,<3.14"
dependencies = [
  "nebula-desktop",
  "nebula-renderer-cli",
  "nebula-image-io",
  "nebula-versioning",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pyinstaller>=6.10",
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "ruff>=0.6",
]

[tool.uv.sources]
nebula-desktop = { workspace = true }
nebula-image-io = { workspace = true }
nebula-renderer-cli = { workspace = true }
nebula-versioning = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/project-model",
  "packages/project-io",
  "packages/image-io",
  "packages/engine",
  "packages/versioning",
  "apps/renderer-cli",
  "apps/desktop",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [".uv-cache", ".venv"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["project_model", "project_io", "image_io", "engine", "versioning", "renderer_cli", "nebula_desktop"]

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "yaml"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebulamaster_workspace"]
