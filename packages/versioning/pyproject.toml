[project]
name = "nebula-versioning"
version = "0.4.3"
description = "Local Git-backed project history for Nebula Master"
requires-python = ">=3.13,<3.14"
dependencies = [
  "nebula-project-model",
  "nebula-project-io",
  "nebula-engine",
  "pydantic>=2.8",
]

[tool.uv.sources]
nebula-project-model = { workspace = true }
nebula-project-io = { workspace = true }
nebula-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/versioning"]
