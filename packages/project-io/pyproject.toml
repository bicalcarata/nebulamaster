[project]
name = "nebula-project-io"
version = "0.2.1"
description = "YAML loading and filesystem resolution for Nebula Master projects"
requires-python = ">=3.13,<3.14"
dependencies = [
  "nebula-project-model",
  "pydantic>=2.8",
  "PyYAML>=6.0.2",
]

[tool.uv.sources]
nebula-project-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_io"]
