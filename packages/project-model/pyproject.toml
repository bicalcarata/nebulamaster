[project]
name = "nebula-project-model"
version = "0.5.3"
description = "Strict project models for Nebula Master"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_model"]
