[project]
name = "nebula-image-io"
version = "0.2.0"
description = "Image metadata and loading helpers for Nebula Master"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1",
  "Pillow>=10.4",
  "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_io"]
