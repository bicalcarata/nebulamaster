[project]
name = "nebula-renderer-cli"
version = "0.5.4"
description = "Renderer CLI for NebulaMaster"
requires-python = ">=3.13,<3.14"
dependencies = [
  "nebula-engine",
  "nebula-versioning",
  "typer>=0.12",
]

[project.scripts]
nebula = "renderer_cli.main:main"

[tool.uv.sources]
nebula-engine = { workspace = true }
nebula-versioning = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renderer_cli"]
