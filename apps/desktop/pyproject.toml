[project]
name = "nebula-desktop"
version = "0.5.2"
description = "Desktop authoring client for Nebula Master"
requires-python = ">=3.13,<3.14"
dependencies = [
  "nebula-engine",
  "nebula-image-io",
  "nebula-project-io",
  "nebula-project-model",
  "PySide6>=6.8",
]

[project.scripts]
nebula-desktop = "nebula_desktop.application.main:main"

[tool.uv.sources]
nebula-engine = { workspace = true }
nebula-image-io = { workspace = true }
nebula-project-io = { workspace = true }
nebula-project-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula_desktop"]
