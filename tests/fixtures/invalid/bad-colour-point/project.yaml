schema_version: 1
project:
  id: bad-colour
  name: Bad Colour
sources:
  - id: source-01
    path: sources/source-01.tif
semantic_channels:
  - id: nebula
    name: Nebula
palettes:
  - id: default-nebula
    path: palettes/default-nebula.yaml
regions:
  - id: region-a
    path: regions/region-a.yaml
render_profiles:
  - id: screen
    path: render_profiles/screen.yaml
plugins:
  path: plugins/lock.yaml
rules:
  - id: test-rule
    target: nebula
    match:
      colour_point: nebula-blue
      brightness:
        min: 0.8
        max: 0.2
      regions: [region-a]
    transform:
      blue: 0.2

