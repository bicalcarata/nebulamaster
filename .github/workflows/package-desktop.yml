name: Package Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v0.1.0. Leave empty for an artifact-only test build.
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag != '' && (startsWith(inputs.release_tag, 'v') && inputs.release_tag || format('v{0}', inputs.release_tag)) || github.ref_name }}

jobs:
  prepare-release:
    if: ${{ startsWith(inputs.release_tag != '' && (startsWith(inputs.release_tag, 'v') && inputs.release_tag || format('v{0}', inputs.release_tag)) || github.ref_name, 'v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Create or reuse draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --title "${RELEASE_TAG}" --generate-notes --draft

  package-macos:
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync workspace dependencies
        run: uv sync --dev

      - name: Build macOS desktop bundle
        run: uv run python scripts/package_desktop.py

      - name: Upload desktop packaging artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nebula-desktop-macos
          path: |
            dist/Nebula Master.app
            dist/NebulaMaster-MacOS.app.zip
            dist/NebulaMaster-MacOS.dmg

      - name: Upload macOS assets to draft release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("dist/NebulaMaster-MacOS.app.zip")
          if [[ -f "dist/NebulaMaster-MacOS.dmg" ]]; then
            files+=("dist/NebulaMaster-MacOS.dmg")
          fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber

  package-windows:
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync workspace dependencies
        run: uv sync --dev

      - name: Build Windows desktop bundle
        run: uv run python scripts/package_desktop.py

      - name: Upload desktop packaging artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nebula-desktop-windows
          path: |
            dist/Nebula Master
            dist/NebulaMaster-Windows.zip
            dist/NebulaMaster-Windows-Setup.exe

      - name: Upload Windows assets to draft release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "${env:RELEASE_TAG}" "dist/NebulaMaster-Windows.zip" --repo "${env:GITHUB_REPOSITORY}" --clobber
          if (Test-Path "dist/NebulaMaster-Windows-Setup.exe") {
            gh release upload "${env:RELEASE_TAG}" "dist/NebulaMaster-Windows-Setup.exe" --repo "${env:GITHUB_REPOSITORY}" --clobber
          }

  publish-release:
    if: ${{ startsWith(inputs.release_tag != '' && (startsWith(inputs.release_tag, 'v') && inputs.release_tag || format('v{0}', inputs.release_tag)) || github.ref_name, 'v') }}
    needs:
      - prepare-release
      - package-macos
      - package-windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest

      - name: Update movable major tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          major_tag="$(printf '%s\n' "${RELEASE_TAG}" | cut -d. -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${major_tag}" -m "Latest ${major_tag} release ${RELEASE_TAG}"
          if ! git push origin "refs/tags/${major_tag}" --force; then
            echo "Warning: could not update movable tag ${major_tag}. The immutable release ${RELEASE_TAG} is still published." >&2
          fi
