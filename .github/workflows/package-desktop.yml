name: Package Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v0.1.0. Leave empty for an artifact-only test build.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  package-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync workspace dependencies
        run: uv sync --dev

      - name: Build macOS desktop bundle
        run: uv run python scripts/package_desktop.py

      - name: Upload desktop packaging artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nebula-desktop-macos
          path: |
            dist/Nebula Master.app
            dist/NebulaMaster.app.zip
            dist/NebulaMaster.dmg

      - name: Create or update GitHub release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
          gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes
          files=("dist/NebulaMaster.app.zip")
          if [[ -f "dist/NebulaMaster.dmg" ]]; then
            files+=("dist/NebulaMaster.dmg")
          fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

  package-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync workspace dependencies
        run: uv sync --dev

      - name: Build Windows desktop bundle
        run: uv run python scripts/package_desktop.py

      - name: Upload desktop packaging artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nebula-desktop-windows
          path: |
            dist/Nebula Master
            dist/NebulaMaster-windows.zip
            dist/NebulaMaster-Setup.exe

      - name: Upload Windows release asset
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release view "${env:RELEASE_TAG}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${env:RELEASE_TAG}" --title "${env:RELEASE_TAG}" --generate-notes
          }
          gh release upload "${env:RELEASE_TAG}" "dist/NebulaMaster-windows.zip" --clobber
          if (Test-Path "dist/NebulaMaster-Setup.exe") {
            gh release upload "${env:RELEASE_TAG}" "dist/NebulaMaster-Setup.exe" --clobber
          }
