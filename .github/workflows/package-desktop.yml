name: Package Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync workspace dependencies
        run: uv sync --dev

      - name: Build macOS desktop bundle
        run: make package-desktop

      - name: Upload desktop packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-desktop-macos
          path: |
            dist/Nebula Master.app
            dist/NebulaMaster.app.zip
            dist/NebulaMaster.dmg

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/NebulaMaster.app.zip" \
            "dist/NebulaMaster.dmg" \
            --clobber
