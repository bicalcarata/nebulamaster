name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create, for example v0.2.0
        required: true
        type: string
      target_ref:
        description: Branch or commit to tag
        required: true
        default: main
        type: string

permissions:
  actions: write
  contents: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Normalize release version
        id: normalize_version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must look like 0.2.0, v0.2.0, or v0.2.0-beta.1." >&2
            exit 1
          fi
          if [[ "${version}" != v* ]]; then
            version="v${version}"
          fi
          echo "RELEASE_TAG=${version}" >> "${GITHUB_ENV}"
          echo "release_tag=${version}" >> "${GITHUB_OUTPUT}"

      - name: Confirm project version matches tag
        run: |
          python -c "import pathlib, tomllib; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); expected = '${{ env.RELEASE_TAG }}'[1:]; actual = data['project']['version']; print(f'pyproject.toml version: {actual}'); raise SystemExit(0 if actual == expected else f'pyproject.toml version {actual} does not match release tag {expected}')"

      - name: Ensure the tag does not already exist
        shell: bash
        run: |
          version="${{ env.RELEASE_TAG }}"
          if git rev-parse "${version}" >/dev/null 2>&1; then
            echo "Tag ${version} already exists locally." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Tag ${version} already exists on origin." >&2
            exit 1
          fi

      - name: Create annotated release tag
        shell: bash
        run: |
          version="${{ env.RELEASE_TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${version}" -m "Release ${version}"

      - name: Push release tag
        shell: bash
        run: |
          git push origin "${{ env.RELEASE_TAG }}"

      - name: Start packaging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run package-desktop.yml \
            --ref "${{ env.RELEASE_TAG }}" \
            -f release_tag="${{ env.RELEASE_TAG }}"

      - name: Summarize next step
        shell: bash
        run: |
          echo "Created tag ${{ env.RELEASE_TAG }} from ${{ inputs.target_ref }}."
          echo "Started Package Desktop for ${{ env.RELEASE_TAG }}."
          echo "That workflow will build macOS and Windows artifacts and publish the GitHub Release."
